<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080613"><title>Alien Zapper Leaderboard</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="eyebrow">NULLWORKS · ALIEN ZAPPER</div><h1>FOREVER LEADERBOARD</h1><p class="sub">Global board when durable storage is active; local phone scores remain separate.</p></header><main class="wrap"><section class="card"><div class="button-row"><a class="button-link accent" href="index.html">Play Alien Zapper</a><a class="button-link" href="targets.html">Print Targets</a></div><div id="boardStatus" class="compat">Loading board…</div></section><section class="card"><table class="leaderboard"><thead><tr><th>#</th><th>Player</th><th>Score</th><th>Venue</th><th>Date</th></tr></thead><tbody id="rows"></tbody></table></section><section class="card"><h2>This phone</h2><table class="leaderboard"><thead><tr><th>#</th><th>Player</th><th>Score</th><th>Date</th></tr></thead><tbody id="localRows"></tbody></table></section></main><script>const localKey='nullworks.alien-zapper.local-scores.v1';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(id,a,global){document.getElementById(id).innerHTML=(a||[]).map((x,i)=>`<tr><td class="rank">${i+1}</td><td>${esc(x.player_name||x.playerName)}</td><td><b>${Number(x.score||0)}</b></td>${global?`<td>${esc(x.venue)}</td>`:''}<td>${new Date(x.played_at||x.playedAt).toLocaleDateString()}</td></tr>`).join('')||`<tr><td colspan="5">No scores yet.</td></tr>`}try{render('localRows',JSON.parse(localStorage.getItem(localKey)||'[]'),false)}catch{}fetch('/api/alien-zapper/scores',{cache:'no-store'}).then(async r=>{const b=await r.json();if(!r.ok)throw Error(b?.error?.message||'Global board unavailable');render('rows',b.scores,true);document.getElementById('boardStatus').textContent='Global durable leaderboard is online.'}).catch(e=>{document.getElementById('boardStatus').textContent='Global durable leaderboard is not activated yet: '+e.message;render('rows',[],true)})</script></body></html>
