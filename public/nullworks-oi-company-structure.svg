<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">The NULLWORKS Digital Workforce</title>
  <desc id="desc">A human-controlled operating structure for specialized AI agents.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8ef"/>
      <stop offset="1" stop-color="#eee7d8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cba85a"/>
      <stop offset="0.5" stop-color="#8f6c27"/>
      <stop offset="1" stop-color="#d9bd79"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2d2414" flood-opacity="0.12"/>
    </filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .serif{font-family:Georgia,"Times New Roman",serif}
      .caps{letter-spacing:4px;text-transform:uppercase}
      .small{font-size:20px;fill:#71664f}
      .label{font-size:18px;font-weight:700;letter-spacing:2.4px;fill:#8f6c27}
      .title{font-size:32px;font-weight:800;fill:#17150f}
      .body{font-size:19px;fill:#5e5544}
      .line{stroke:#a9873f;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .card{fill:#fffdf7;stroke:#d8c8a5;stroke-width:2}
      .dark{fill:#181610;stroke:#181610;stroke-width:2}
      .darkTitle{font-size:30px;font-weight:800;fill:#fffdf7}
      .darkBody{font-size:18px;fill:#d7ccb4}
    </style>
  </defs>

  <rect width="1080" height="1350" fill="url(#paper)"/>
  <rect x="34" y="34" width="1012" height="1282" rx="38" fill="none" stroke="#b89345" stroke-width="2"/>
  <text x="540" y="720" text-anchor="middle" class="sans" font-size="430" font-weight="900" fill="#8f6c27" opacity="0.035">NW</text>

  <text x="72" y="98" class="sans caps label">NULLWORKS // FIELD NOTE 001</text>
  <text x="72" y="162" class="serif" font-size="58" font-weight="700" fill="#17150f">THE DIGITAL WORKFORCE</text>
  <text x="72" y="208" class="sans small">A human-controlled operating structure for specialized AI agents.</text>
  <line x1="72" y1="242" x2="1008" y2="242" stroke="url(#gold)" stroke-width="4"/>

  <rect x="250" y="280" width="580" height="132" rx="28" class="dark" filter="url(#shadow)"/>
  <text x="540" y="326" text-anchor="middle" class="sans caps" font-size="17" font-weight="800" fill="#d9bd79">FINAL HUMAN AUTHORITY</text>
  <text x="540" y="366" text-anchor="middle" class="sans darkTitle">MASON / THE EXPERT</text>
  <text x="540" y="394" text-anchor="middle" class="sans darkBody">Sets intent • approves action • stops the line</text>

  <path d="M540 412 V456" class="line"/>
  <circle cx="540" cy="456" r="6" fill="#a9873f"/>

  <rect x="176" y="470" width="728" height="124" rx="26" class="card" filter="url(#shadow)"/>
  <text x="540" y="512" text-anchor="middle" class="sans caps label">BOARDROOM / CONTROL LAYER</text>
  <text x="540" y="550" text-anchor="middle" class="sans title">Priorities • Routing • Boundaries • Decisions</text>
  <text x="540" y="578" text-anchor="middle" class="sans body">The human-readable interface around the digital workforce.</text>

  <path d="M540 594 V638 M540 638 H206 M540 638 H540 M540 638 H874 M206 638 V674 M540 638 V674 M874 638 V674" class="line"/>

  <rect x="74" y="674" width="264" height="146" rx="24" class="card"/>
  <text x="206" y="714" text-anchor="middle" class="sans caps label">OPERATIONS</text>
  <text x="206" y="752" text-anchor="middle" class="sans title">Intake + Routing</text>
  <text x="206" y="783" text-anchor="middle" class="sans body">Classify work</text>
  <text x="206" y="808" text-anchor="middle" class="sans body">assign ownership</text>

  <rect x="408" y="674" width="264" height="146" rx="24" class="card"/>
  <text x="540" y="714" text-anchor="middle" class="sans caps label">QUALITY</text>
  <text x="540" y="752" text-anchor="middle" class="sans title">Review + Waste</text>
  <text x="540" y="783" text-anchor="middle" class="sans body">Challenge assumptions</text>
  <text x="540" y="808" text-anchor="middle" class="sans body">detect failure</text>

  <rect x="742" y="674" width="264" height="146" rx="24" class="card"/>
  <text x="874" y="714" text-anchor="middle" class="sans caps label">CONTINUITY</text>
  <text x="874" y="752" text-anchor="middle" class="sans title">Memory + Receipts</text>
  <text x="874" y="783" text-anchor="middle" class="sans body">Preserve sources</text>
  <text x="874" y="808" text-anchor="middle" class="sans body">decisions and state</text>

  <path d="M206 820 V858 H540 M540 820 V858 M874 820 V858 H540 M540 858 V890" class="line"/>

  <rect x="150" y="890" width="780" height="112" rx="26" class="dark" filter="url(#shadow)"/>
  <text x="540" y="933" text-anchor="middle" class="sans caps" font-size="17" font-weight="800" fill="#d9bd79">SCOPED PROJECT WORKROOMS</text>
  <text x="540" y="970" text-anchor="middle" class="sans darkTitle">Objectives • Context • Evidence • Current State</text>

  <path d="M540 1002 V1040 M540 1040 H210 M540 1040 H540 M540 1040 H870 M210 1040 V1068 M540 1040 V1068 M870 1040 V1068" class="line"/>

  <rect x="74" y="1068" width="272" height="126" rx="22" class="card"/>
  <text x="210" y="1108" text-anchor="middle" class="sans caps label">RESEARCH</text>
  <text x="210" y="1146" text-anchor="middle" class="sans title">Evidence Cells</text>
  <text x="210" y="1176" text-anchor="middle" class="sans body">Find • compare • verify</text>

  <rect x="404" y="1068" width="272" height="126" rx="22" class="card"/>
  <text x="540" y="1108" text-anchor="middle" class="sans caps label">BUILD</text>
  <text x="540" y="1146" text-anchor="middle" class="sans title">Specialist Cells</text>
  <text x="540" y="1176" text-anchor="middle" class="sans body">Prototype • test • repair</text>

  <rect x="734" y="1068" width="272" height="126" rx="22" class="card"/>
  <text x="870" y="1108" text-anchor="middle" class="sans caps label">DELIVERY</text>
  <text x="870" y="1146" text-anchor="middle" class="sans title">Artifact Cells</text>
  <text x="870" y="1176" text-anchor="middle" class="sans body">Package • explain • ship</text>

  <path d="M210 1194 V1220 H540 M540 1194 V1220 M870 1194 V1220 H540" class="line"/>
  <rect x="210" y="1220" width="660" height="60" rx="20" fill="#ede3cd" stroke="#b89345" stroke-width="2"/>
  <text x="540" y="1258" text-anchor="middle" class="sans" font-size="22" font-weight="800" fill="#17150f">REVIEW GATE → HUMAN ACTION → TELEMETRY → LEARNING</text>

  <text x="540" y="1308" text-anchor="middle" class="sans caps" font-size="17" font-weight="800" fill="#6b5b38">AI IS THE TOOL • OI IS THE OPERATING SYSTEM • HUMAN AUTHORITY REMAINS FINAL</text>
</svg>