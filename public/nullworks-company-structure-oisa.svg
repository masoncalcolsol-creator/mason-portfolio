<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">NULLWORKS Executive Structure Around the AI Operator</title>
  <desc id="desc">Mason Perry as final human authority above a human-led AI Operator, supported by eight digital executive functions, 65-plus specialist work cells, NEURAXIS report-back, source evidence, telemetry, and review gates.</desc>
