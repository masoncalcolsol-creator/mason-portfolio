<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1600" viewBox="0 0 1080 1600" role="img" aria-labelledby="title desc">
  <title id="title">NULLWORKS Operational Intelligence Company Structure</title>
  <desc id="desc">A public, human-controlled company structure showing Mason Perry as final authority, the NULLWORKS Boardroom executive functions, project workrooms, specialist cells, review gates, and telemetry.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8ef"/>
      <stop offset="1" stop-color="#eee5d3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfc783"/>
      <stop offset="0.45" stop-color="#9b742c"/>
      <stop offset="1" stop-color="#d9bd72"/>
    </linearGradient>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242016"/>
      <stop offset="1" stop-color="#11100c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="13" stdDeviation="16" flood-color="#302716" flood-opacity="0.13"/>
    </filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .serif{font-family:Georgia,"Times New Roman",serif}
      .caps{letter-spacing:3.3px;text-transform:uppercase}
      .kicker{font-size:17px;font-weight:800;fill:#8a6726}
      .h1{font-size:53px;font-weight:700;fill:#181610}
      .sub{font-size:20px;fill:#625844}
      .card{fill:#fffdf7;stroke:#d7c59d;stroke-width:2}
      .dark{fill:url(#black);stroke:#181610;stroke-width:2}
      .goldbox{fill:#eee1c4;stroke:#aa8238;stroke-width:2}
      .name{font-size:25px;font-weight:850;fill:#181610}
      .role{font-size:15px;font-weight:800;letter-spacing:1.4px;fill:#8a6726}
      .body{font-size:15px;fill:#665b46}
      .darkname{font-size:29px;font-weight:850;fill:#fffaf0}
      .darkrole{font-size:15px;font-weight:800;letter-spacing:1.6px;fill:#d8bd73}
      .darkbody{font-size:16px;fill:#d9cfbb}
      .line{stroke:#a78239;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#c5ad78;stroke-width:2;fill:none;stroke-linecap:round}
    </style>
  </defs>

  <rect width="1080" height="1600" fill="url(#paper)"/>
  <rect x="32" y="32" width="1016" height="1536" rx="38" fill="none" stroke="#aa8238" stroke-width="2"/>
  <text x="540" y="965" text-anchor="middle" class="sans" font-size="460" font-weight="950" fill="#9a742d" opacity="0.032">NW</text>

  <text x="72" y="94" class="sans caps kicker">NULLWORKS // PUBLIC OI ARCHITECTURE</text>
  <text x="72" y="154" class="serif h1">THE COMPANY AROUND THE AI</text>
  <text x="72" y="198" class="sans sub">A human-readable operating structure for specialized digital labor.</text>
  <line x1="72" y1="230" x2="1008" y2="230" stroke="url(#gold)" stroke-width="4"/>

  <rect x="220" y="270" width="640" height="142" rx="30" class="dark" filter="url(#shadow)"/>
