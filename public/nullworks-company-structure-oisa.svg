      <stop offset=".35" stop-color="#7c674b"/>
      <stop offset=".7" stop-color="#20292f"/>
      <stop offset="1" stop-color="#080d11"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
