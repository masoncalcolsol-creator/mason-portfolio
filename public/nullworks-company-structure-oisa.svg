<svg xmlns="http://www.w3.org/2000/svg" width="1086" height="1448" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
  <title id="title">NULLWORKS OI SUITe Executive Structure</title>
  <desc id="desc">A self-contained NULLWORKS organizational architecture chart showing Mason Perry as final human authority, the AI Operator at the center, executive functions, specialist cells, NEURAXIS report-back, review gates, telemetry, and client boundaries.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#17202b"/>
      <stop offset="58%" stop-color="#071019"/>
      <stop offset="100%" stop-color="#04080d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f0d892"/>
      <stop offset="45%" stop-color="#c9a45f"/>
      <stop offset="100%" stop-color="#7d6134"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.75  0 1 0 0 0.55  0 0 1 0 0.22  0 0 0 0.72 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 9px; letter-spacing: 2.4px; font-weight: 800; text-transform: uppercase; }
      .micro { font-family: Arial, Helvetica, sans-serif; font-size: 8px; letter-spacing: 1.4px; font-weight: 700; }
      .body { font-family: Georgia, 'Times New Roman', serif; font-size: 13px; fill: #efe6d4; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 10px; letter-spacing: 2px; font-weight: 900; fill: #d8b56a; text-transform: uppercase; }
      .title { font-family: Georgia, 'Times New Roman', serif; font-size: 25px; font-weight: 700; fill: #f5ecdd; }
      .nodeTitle { font-family: Georgia, 'Times New Roman', serif; font-size: 16px; font-weight: 700; fill: #f5ecdd; }
      .nodeText { font-family: Arial, Helvetica, sans-serif; font-size: 10px; fill: #cfc4b3; }
      .line { stroke: #b8914d; stroke-width: 1.2; opacity: 0.78; fill: none; }
      .dash { stroke: #b8914d; stroke-width: 1.1; opacity: 0.56; fill: none; stroke-dasharray: 4 7; }
      .box { fill: rgba(9,14,20,0.92); stroke: #8b6d38; stroke-width: 1.2; rx: 10; }
      .softBox { fill: rgba(12,18,25,0.88); stroke: #6c562f; stroke-width: 1; rx: 12; }
    </style>
  </defs>

  <rect width="600" height="800" fill="url(#bgGlow)"/>
  <rect x="22" y="22" width="556" height="756" rx="28" fill="none" stroke="#7a6337" stroke-opacity="0.52"/>
  <circle cx="300" cy="336" r="154" fill="none" stroke="#d8b56a" stroke-opacity="0.08" stroke-width="28"/>
  <circle cx="300" cy="336" r="108" fill="none" stroke="#d8b56a" stroke-opacity="0.18" stroke-dasharray="2 6"/>

  <text x="300" y="54" text-anchor="middle" class="small" fill="#d8b56a">NULLWORKS // Operational Intelligence</text>
  <text x="300" y="86" text-anchor="middle" class="title">Executive Structure Around the AI Operator</text>
  <text x="300" y="111" text-anchor="middle" class="micro" fill="#bdb2a1">Human authority • scoped workrooms • source evidence • telemetry • review gates</text>

  <rect x="169" y="135" width="262" height="54" rx="13" class="box"/>
  <text x="300" y="157" text-anchor="middle" class="label">Final Human Authority</text>
  <text x="300" y="178" text-anchor="middle" class="nodeTitle">Mason Perry</text>
  <path d="M300 189 L300 228" class="line"/>

  <rect x="202" y="228" width="196" height="58" rx="14" fill="rgba(13,18,24,0.95)" stroke="#d8b56a" stroke-width="1.3"/>
  <text x="300" y="250" text-anchor="middle" class="label">Executive Directive</text>
  <text x="300" y="272" text-anchor="middle" class="body">human outcomes govern the system</text>
  <path d="M300 286 L300 316" class="line"/>

  <circle cx="300" cy="366" r="64" fill="#0b1118" stroke="url(#gold)" stroke-width="2.1" filter="url(#softGlow)"/>
  <text x="300" y="355" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" font-weight="800" fill="#f6eee1">AI</text>
  <text x="300" y="382" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="800" fill="#f6eee1">OPERATOR</text>
  <text x="300" y="404" text-anchor="middle" class="nodeText">coordination • synthesis • execution support</text>

  <rect x="55" y="246" width="116" height="76" rx="12" class="softBox"/>
  <text x="113" y="268" text-anchor="middle" class="label">Knox</text>
  <text x="113" y="288" text-anchor="middle" class="nodeTitle">Ops</text>
  <text x="113" y="307" text-anchor="middle" class="nodeText">intake • routing</text>

  <rect x="55" y="360" width="116" height="76" rx="12" class="softBox"/>
  <text x="113" y="382" text-anchor="middle" class="label">Kaizen</text>
  <text x="113" y="402" text-anchor="middle" class="nodeTitle">QA</text>
  <text x="113" y="421" text-anchor="middle" class="nodeText">waste • gates</text>

  <rect x="429" y="246" width="116" height="76" rx="12" class="softBox"/>
  <text x="487" y="268" text-anchor="middle" class="label">Crow</text>
  <text x="487" y="288" text-anchor="middle" class="nodeTitle">Advisor</text>
  <text x="487" y="307" text-anchor="middle" class="nodeText">pattern • risk</text>

  <rect x="429" y="360" width="116" height="76" rx="12" class="softBox"/>
  <text x="487" y="382" text-anchor="middle" class="label">NT2</text>
  <text x="487" y="402" text-anchor="middle" class="nodeTitle">Historian</text>
  <text x="487" y="421" text-anchor="middle" class="nodeText">continuity</text>

  <path d="M171 284 C221 284 228 346 236 360" class="line"/>
  <path d="M171 398 C221 398 226 382 237 374" class="line"/>
  <path d="M429 284 C379 284 372 346 364 360" class="line"/>
  <path d="M429 398 C379 398 374 382 363 374" class="line"/>

  <rect x="84" y="478" width="432" height="58" rx="14" fill="rgba(12,18,25,0.94)" stroke="#8b6d38" stroke-width="1.2"/>
  <text x="300" y="500" text-anchor="middle" class="label">Specialist Work Cells</text>
  <text x="300" y="522" text-anchor="middle" class="body">bounded missions • time-bound work • return-and-report discipline</text>
  <path d="M300 430 L300 478" class="line"/>

  <rect x="44" y="576" width="120" height="70" rx="12" class="softBox"/>
  <text x="104" y="603" text-anchor="middle" class="label">Investigate</text>
  <text x="104" y="624" text-anchor="middle" class="nodeText">source discovery</text>

  <rect x="184" y="576" width="120" height="70" rx="12" class="softBox"/>
  <text x="244" y="603" text-anchor="middle" class="label">Build</text>
  <text x="244" y="624" text-anchor="middle" class="nodeText">artifact execution</text>

  <rect x="324" y="576" width="120" height="70" rx="12" class="softBox"/>
  <text x="384" y="603" text-anchor="middle" class="label">Verify</text>
  <text x="384" y="624" text-anchor="middle" class="nodeText">QA + evidence</text>

  <rect x="464" y="576" width="92" height="70" rx="12" class="softBox"/>
  <text x="510" y="603" text-anchor="middle" class="label">Ship</text>
  <text x="510" y="624" text-anchor="middle" class="nodeText">delivery</text>

  <path d="M104 576 L104 548 L300 548 L300 536" class="dash"/>
  <path d="M244 576 L244 548" class="dash"/>
  <path d="M384 576 L384 548" class="dash"/>
  <path d="M510 576 L510 548 L300 548" class="dash"/>

  <rect x="163" y="684" width="274" height="58" rx="14" fill="rgba(13,18,24,0.94)" stroke="#d8b56a" stroke-opacity="0.7"/>
  <text x="300" y="707" text-anchor="middle" class="label">NEURAXIS Report Back</text>
  <text x="300" y="729" text-anchor="middle" class="body">learn • compress • preserve receipts • evolve</text>

  <path d="M104 646 L104 713 L163 713" class="line"/>
  <path d="M244 646 L244 684" class="line"/>
  <path d="M384 646 L384 684" class="line"/>
  <path d="M510 646 L510 713 L437 713" class="line"/>

  <text x="300" y="766" text-anchor="middle" class="micro" fill="#8d8273">No independent canon. No hidden authority. The human remains accountable for the outcome.</text>
</svg>
