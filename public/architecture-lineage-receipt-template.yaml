  supporting_reasons:
    - ""
  contradictory_evidence:
    - ""
  unresolved_questions:
    - ""
  classified_by: ""
  classified_at: ""

current_boundary:
  evidence_supports:
    - ""
  evidence_does_not_support:
    - ""
