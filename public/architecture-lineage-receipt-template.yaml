      replacement: ""
  formalized_elements:
    - ""
  recombined_elements:
    - ""
  genuinely_added_elements:
    - ""
  removed_attribution:
    - ""
  unresolved_similarity:
    - ""

ai_contribution:
  provider: ""
  model: ""
  role: "retrieval | reconstruction | comparison | translation | generation | review | other"
  source_context_supplied: ""
