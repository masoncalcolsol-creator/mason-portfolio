    sequence: 1
    event_type: "origin | exposure | transformation | correction | retirement | reauthorization | publication | dispute"
    occurred_at: ""
    actor: ""
    authority: ""
    input_artifacts:
      - ""
    action: ""
    output_artifacts:
      - ""
    what_changed: ""
    what_did_not_change: ""
    model_contribution: ""
    human_contribution: ""
    evidence:
      - ""
    uncertainty: ""

transformation_analysis:
  preserved_elements:
    - ""
  renamed_elements:
