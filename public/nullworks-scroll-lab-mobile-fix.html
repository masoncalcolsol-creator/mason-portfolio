<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0a">
<title>NULLWORKS Scroll Lab — Mobile Width Fix</title>
<style>
html,body{margin:0;min-height:100%;background:#090a0a;color:#f2eee5;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.boot{padding:24px;text-align:center}.boot b{display:block;letter-spacing:.14em}.boot small{display:block;margin-top:10px;color:#9c9b94}
</style>
</head>
<body>
<div class="boot"><b>NULLWORKS</b><small>Loading mobile scroll repair…</small></div>
<script>
(async()=>{
  const stableH=Math.round(window.visualViewport?.height||window.innerHeight);
  const source=await fetch('./nullworks-scroll-lab.html?source=mobile-width-fix-1',{cache:'no-store'});
  let html=await source.text();
  const patch=`
<style id="mobile-width-lock">
:root{--stable-mobile-height:${stableH}px!important}
html,body{width:100%!important;max-width:100%!important;overflow-x:clip!important;overscroll-behavior-x:none!important}
body>*,main,main>section,header,footer{max-width:100vw!important}
main{width:100%!important;overflow-x:clip!important}
.hero,.manifesto,.story,.receipts,.finale{width:100%!important;max-width:100vw!important;overflow-x:clip!important}
.stage{left:0!important;right:0!important;width:auto!important;max-width:100vw!important;height:var(--stable-mobile-height)!important;contain:layout paint!important;transform:translateZ(0)!important}
.stage.is-pinned{left:0!important;right:0!important;width:auto!important;height:var(--stable-mobile-height)!important}
.stage.is-ended{left:0!important;right:0!important;width:auto!important}
.world{width:100%!important;max-width:100vw!important;overflow:hidden!important;contain:layout paint!important}
.topline{max-width:calc(100vw - 36px)!important}
.ghost-art{max-width:none!important}
.deck{max-width:100vw!important}
@media(max-width:760px){
  .stage{height:var(--stable-mobile-height)!important}
  .ghost-art{width:112vw!important}
  .node{max-width:142px!important}
  .panel{max-width:calc(100vw - 36px)!important}
}
</style>`;
  html=html.replace('</head>',patch+'</head>');
  html=html.replace('let raf=0;function viewportHeight(){return Math.round(vv?.height||innerHeight)}',`let raf=0;const stableMobileHeight=${stableH};function viewportHeight(){return mq.matches?stableMobileHeight:Math.round(vv?.height||innerHeight)}`);
  html=html.replace("vv?.addEventListener('resize',schedule);vv?.addEventListener('scroll',schedule);update();","update();");
  html=html.replace('</script>\n</body></html>',"addEventListener('orientationchange',()=>location.reload());</script>\n</body></html>");
  document.open();document.write(html);document.close();
})().catch(error=>{document.body.innerHTML='<div class="boot"><b>LOAD FAILED</b><small>'+String(error)+'</small></div>'});
</script>
</body>
</html>
