concept: >-
  Twelve-movement fictional c.1890 Latin-language industrial doom opera. The narrative
  begins with the Earth before industrial intervention, moves through extraction,
  ecological conversion, industrial accumulation, Homo Morbus, human commodification,
  depopulation, and ends after the human voice disappears. Earth remembers and remains.

