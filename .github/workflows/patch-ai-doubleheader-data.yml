name: Patch AI Doubleheader data integrity

on:
  push:
    paths:
      - .github/workflows/patch-ai-doubleheader-data.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch importer and exporter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/ai-doubleheader/page.tsx")
          text = path.read_text()

          replacements = [
              (
                  "return value.slice(0, 4).map((item) => {",
                  "return value.map((item) => {",
              ),
              (
                  "human_card: normalizeCard(root.human_card, masonSample.human_card),",
                  "human_card: normalizeCard(root.human_card, emptyCard),",
              ),
              (
                  "ai_card: normalizeCard(root.ai_card, masonSample.ai_card),",
                  "ai_card: normalizeCard(root.ai_card, emptyCard),",
              ),
              (
                  "const blob = new Blob([JSON.stringify(data, null, 2)], {",
                  "const blob = new Blob([JSON.stringify(pruneEmpty(data), null, 2)], {",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected source not found: {old}")
              text = text.replace(old, new, 1)

          empty_card = '''\nconst emptyCard: Card = {\n  name: \"\",\n  call_sign: \"\",\n  current_role: \"\",\n  archetype: \"\",\n  strengths: [],\n  limitations: [],\n  signature_move: \"\",\n  best_use_situation: \"\",\n  likely_failure_mode: \"\",\n  escalation_rule: \"\",\n  scouting_report: \"\",\n  visual_concept: \"\",\n};\n'''
          marker = "\nfunction textArray(value: unknown, fallback: string[]) {"
          if "const emptyCard: Card" not in text:
              if marker not in text:
                  raise SystemExit("Could not locate emptyCard insertion point")
              text = text.replace(marker, empty_card + marker, 1)

          prune = '''\nfunction pruneEmpty(value: unknown): unknown {\n  if (Array.isArray(value)) {\n    return value\n      .map(pruneEmpty)\n      .filter((item) => item !== undefined);\n  }\n  if (value && typeof value === \"object\") {\n    const entries = Object.entries(value as Record<string, unknown>)\n      .map(([key, item]) => [key, pruneEmpty(item)] as const)\n      .filter(([, item]) => item !== undefined);\n    return Object.fromEntries(entries);\n  }\n  if (value === \"\" || value === null || value === undefined) return undefined;\n  return value;\n}\n'''
          marker = "\nfunction downloadJson(data: unknown, name: string) {"
          if "function pruneEmpty" not in text:
              if marker not in text:
                  raise SystemExit("Could not locate pruneEmpty insertion point")
              text = text.replace(marker, prune + marker, 1)

          old_import = '''  function importJson() {\n    setJsonError(\"\");\n    try {\n      const parsed = JSON.parse(stripFence(rawJson));\n      const normalized = normalizeData(parsed, profile);\n      setCardData(normalized);\n      localStorage.setItem(`${DATA_PREFIX}${accountId}`, JSON.stringify(normalized));\n      setNotice(\"Cards loaded. Review the content before exporting.\");\n    } catch (error) {\n      setJsonError(error instanceof Error ? error.message : \"Invalid JSON.\");\n    }\n  }'''
          new_import = '''  function importJson() {\n    setJsonError(\"\");\n    setCardData(null);\n    localStorage.removeItem(`${DATA_PREFIX}${accountId}`);\n    try {\n      const parsed = JSON.parse(stripFence(rawJson));\n      const normalized = normalizeData(parsed, profile);\n      const selectedMode = profile.contextMode.trim().toLowerCase();\n      const reportedMode = normalized.telemetry.context_mode.trim().toLowerCase();\n      const conditionMismatch =\n        Boolean(selectedMode) &&\n        Boolean(reportedMode) &&\n        selectedMode !== reportedMode;\n      setCardData(normalized);\n      localStorage.setItem(`${DATA_PREFIX}${accountId}`, JSON.stringify(normalized));\n      setNotice(\n        conditionMismatch\n          ? `Condition mismatch: selected ${profile.contextMode}, AI reported ${normalized.telemetry.context_mode}. Data loaded, but verify the run before export.`\n          : \"Cards loaded with a clean data swipe. Review before exporting.\",\n      );\n    } catch (error) {\n      setJsonError(error instanceof Error ? error.message : \"Invalid JSON.\");\n    }\n  }'''
          if old_import not in text:
              raise SystemExit("Could not locate importJson function")
          text = text.replace(old_import, new_import, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "NULLWORKS Patch Bot"
          git config user.email "masoncalcolsol@gmail.com"
          git add src/app/ai-doubleheader/page.tsx
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Fix AI Doubleheader clean imports and lossless JSON export [skip ci]"
          git push
