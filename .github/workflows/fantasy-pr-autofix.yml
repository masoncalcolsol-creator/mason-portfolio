name: Fantasy PR Autofix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Patch narrowed league identifier
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/nullworks-fantasy-league/FantasyApp.tsx')
          text = path.read_text()
          old = '''  const myTeam = getMyTeam(league, account.id);

  function mutateLeague(updater: (league: FantasyLeague) => FantasyLeague) {
    setDatabase((current) => updateLeague(current, league.id, updater));
  }
'''
          new = '''  const leagueId = league.id;
  const myTeam = getMyTeam(league, account.id);

  function mutateLeague(updater: (league: FantasyLeague) => FantasyLeague) {
    setDatabase((current) => updateLeague(current, leagueId, updater));
  }
'''
          if old not in text:
              print('Patch already applied or target unavailable.')
          else:
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit repair to PR branch
        run: |
          git config user.name "NULLWORKS Build Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/nullworks-fantasy-league/FantasyApp.tsx
          if git diff --cached --quiet; then
            echo "No patch required."
            exit 0
          fi
          git commit -m "Fix fantasy league type narrowing"
          git push origin HEAD:${{ github.head_ref }}
