name: Verify Next build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production site
        id: build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          tail -n 180 build.log > build-tail.txt
          cat build-tail.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload build tail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-tail
          path: build-tail.txt
          if-no-files-found: error
      - name: Fail when build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
