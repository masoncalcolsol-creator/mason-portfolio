name: Verify NULLWORKS Scroll Lab Live URL

on:
  push:
    branches: [main]
    paths:
      - public/nullworks-scroll-lab.html
      - .github/workflows/nullworks-scroll-lab-pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-url:
    runs-on: ubuntu-latest
    steps:
      - name: Verify clean mobile test URL
        env:
          URL: https://cdn.jsdelivr.net/gh/masoncalcolsol-creator/mason-portfolio@d451ef3e54eb0af477c25a34bc185a21047fde7c/public/nullworks-scroll-lab.html
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --dump-header headers.txt \
            --output page.html \
            "$URL"
          grep -qi '^content-type: text/html' headers.txt
          grep -q '<title>NULLWORKS Scroll Lab</title>' page.html
          grep -q 'THE COMPANY' page.html
          echo "Verified live URL: $URL"
          echo "Response headers:"
          cat headers.txt
