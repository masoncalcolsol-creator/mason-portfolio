name: Verify NULLWORKS Scroll Lab Live URL

on:
  push:
    branches: [main]
    paths:
      - public/nullworks-scroll-lab.html
      - .github/workflows/nullworks-scroll-lab-pages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-live-url:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Find a direct clean HTML endpoint
        run: |
          set -euo pipefail
          COMMIT=d451ef3e54eb0af477c25a34bc185a21047fde7c
          CANDIDATES=(
            "https://cdn.jsdelivr.net/gh/masoncalcolsol-creator/mason-portfolio@${COMMIT}/public/nullworks-scroll-lab.html"
            "https://rawcdn.githack.com/masoncalcolsol-creator/mason-portfolio/${COMMIT}/public/nullworks-scroll-lab.html"
            "https://cdn.statically.io/gh/masoncalcolsol-creator/mason-portfolio/${COMMIT}/public/nullworks-scroll-lab.html"
          )
          WINNER=""
          : > diagnostics.txt
          for URL in "${CANDIDATES[@]}"; do
            rm -f headers.txt page.html
            STATUS=$(curl --location --silent --show-error \
              --dump-header headers.txt \
              --output page.html \
              --write-out '%{http_code}' \
              "$URL" || true)
            TYPE=$(grep -i '^content-type:' headers.txt | tail -1 | tr -d '\r' || true)
            TITLE=no
            HERO=no
            grep -q '<title>NULLWORKS Scroll Lab</title>' page.html 2>/dev/null && TITLE=yes || true
            grep -q 'THE COMPANY' page.html 2>/dev/null && HERO=yes || true
            printf 'URL=%s\nHTTP=%s\n%s\nTITLE=%s\nHERO=%s\n---\n' "$URL" "$STATUS" "$TYPE" "$TITLE" "$HERO" | tee -a diagnostics.txt
            if [[ "$STATUS" == "200" ]] && echo "$TYPE" | grep -qi 'text/html' && [[ "$TITLE" == yes ]] && [[ "$HERO" == yes ]]; then
              WINNER="$URL"
              break
            fi
          done
          if [[ -z "$WINNER" ]]; then
            echo 'No clean direct HTML endpoint passed all checks.' >&2
            cat diagnostics.txt >&2
            exit 1
          fi
          {
            echo "NULLWORKS_SCROLL_LAB_LIVE=VERIFIED"
            echo "URL=$WINNER"
            echo "VERIFIED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "SOURCE_COMMIT=$COMMIT"
            echo
            cat diagnostics.txt
          } > public/nullworks-scroll-lab-live-receipt.txt

      - name: Commit verification receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/nullworks-scroll-lab-live-receipt.txt
          git commit -m "Verify NULLWORKS Scroll Lab live CDN URL" || exit 0
          git push
