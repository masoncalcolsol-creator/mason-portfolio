name: Voice Foundry transcription repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/voice-foundry-transcription-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Voice Foundry transcription
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/app/voice-foundry/VoiceFoundryClient.tsx")
          text = path.read_text()

          if "cloudTranscriptionAvailable" in text:
              print("Voice Foundry transcription repair already installed.")
              raise SystemExit(0)

          replacements = []

          replacements.append((
          '''  const [speechSupported, setSpeechSupported] = useState(false);
            const [guideIndex, setGuideIndex] = useState(0);''',
          '''  const [speechSupported, setSpeechSupported] = useState(false);
            const [cloudTranscriptionAvailable, setCloudTranscriptionAvailable] = useState<boolean | null>(null);
            const [transcribing, setTranscribing] = useState(false);
            const [guideIndex, setGuideIndex] = useState(0);'''
          ))

          replacements.append((
          '''    setSpeechSupported(Boolean(speechWindow.SpeechRecognition || speechWindow.webkitSpeechRecognition));
            }, []);

            useEffect(() => {
              if (!audioBlob) {''',
          '''    setSpeechSupported(Boolean(speechWindow.SpeechRecognition || speechWindow.webkitSpeechRecognition));
            }, []);

            useEffect(() => {
              let cancelled = false;
              void fetch("/api/voice-foundry/transcribe", { cache: "no-store" })
                .then((response) => response.json())
                .then((result: { configured?: boolean }) => {
                  if (!cancelled) setCloudTranscriptionAvailable(Boolean(result.configured));
                })
                .catch(() => {
                  if (!cancelled) setCloudTranscriptionAvailable(false);
                });
              return () => {
                cancelled = true;
              };
            }, []);

            useEffect(() => {
              if (!audioBlob) {'''
          ))

          replacements.append((
          '''  function startSpeechRecognition() {''',
          '''  async function transcribeAudioBlob(blob: Blob | undefined = audioBlob) {
              if (!blob || blob.size === 0) {
                setNotice("Record or open an audio story first.");
                return;
              }
              if (blob.size > 25 * 1024 * 1024) {
                setNotice("This chapter is over the 25 MB transcription limit. Download it and split it into shorter recordings.");
                return;
              }

              setTranscribing(true);
              setNotice("Building the transcript from the recorded audio… Keep this page open.");
              try {
                const extension = blob.type.includes("mp4") ? "m4a" : blob.type.includes("wav") ? "wav" : "webm";
                const form = new FormData();
                form.append("audio", blob, `${safeFilename(title)}.${extension}`);
                const response = await fetch("/api/voice-foundry/transcribe", {
                  method: "POST",
                  body: form,
                });
                const result = (await response.json()) as { text?: string; error?: string; code?: string };
                if (!response.ok || !result.text) {
                  if (result.code === "TRANSCRIPTION_NOT_CONFIGURED") {
                    setCloudTranscriptionAvailable(false);
                  }
                  throw new Error(result.error || "The transcription service did not return text.");
                }
                const nextTranscript = cleanTranscript(result.text);
                setTranscript(nextTranscript);
                setInterimTranscript("");
                setGuidePrompt(pickGuidePrompt(nextTranscript, guideIndex));
                setCloudTranscriptionAvailable(true);
                setNotice("Transcript built from the recorded audio. Review names and details, then save the story.");
              } catch (error) {
                const message = error instanceof Error ? error.message : "The recording could not be transcribed.";
                setNotice(`${message} The original audio is still safe in this open story.`);
              } finally {
                setTranscribing(false);
              }
            }

            function startSpeechRecognition() {'''
          ))

          replacements.append((
          '''    recognition.continuous = true;
              recognition.interimResults = true;''',
          '''    recognition.continuous = !/Android/i.test(navigator.userAgent);
              recognition.interimResults = true;'''
          ))

          replacements.append((
          '''    recognition.onerror = (event) => {
                if (!["aborted", "no-speech"].includes(event.error)) {
                  setNotice(`Live transcription paused (${event.error}). Audio recording is still preserved.`);
                }
              };''',
          '''    recognition.onerror = (event) => {
                if (["audio-capture", "not-allowed", "service-not-allowed"].includes(event.error)) {
                  setSpeechSupported(false);
                }
                if (!["aborted", "no-speech"].includes(event.error)) {
                  setNotice(`Live browser transcription paused (${event.error}). Keep recording; after STOP, use Transcribe audio.`);
                }
              };'''
          ))

          replacements.append((
          '''        setNotice("Recording stopped. Review the transcript, add a title, then save it to the vault.");''',
          '''        setNotice("Audio captured. Tap Transcribe audio to build the transcript from this recording, then review and save it.");'''
          ))

          replacements.append((
          '''                  <div className="vf-stat"><strong>{speechSupported ? "LIVE" : "EDIT"}</strong><span>{speechSupported ? "browser transcription available" : "manual transcript mode"}</span></div>''',
          '''                  <div className="vf-stat"><strong>{cloudTranscriptionAvailable ? "AI" : speechSupported ? "LIVE" : "EDIT"}</strong><span>{cloudTranscriptionAvailable ? "recorded-audio transcription ready" : speechSupported ? "live browser transcription available" : "manual transcript mode"}</span></div>'''
          ))

          replacements.append((
          '''                  <div className="vf-actions">
                        <button className="vf-btn vf-btn-primary" type="button" onClick={() => void saveStory()} disabled={busy || recording}>{busy ? "Saving…" : "Save to vault"}</button>''',
          '''                  <div className="vf-actions">
                        <button className="vf-btn vf-btn-primary" type="button" onClick={() => void transcribeAudioBlob()} disabled={!audioBlob || recording || transcribing}>{transcribing ? "Transcribing…" : "Transcribe audio"}</button>
                        <button className="vf-btn" type="button" onClick={() => void saveStory()} disabled={busy || recording || transcribing}>{busy ? "Saving…" : "Save to vault"}</button>'''
          ))

          replacements.append((
          '''                <div className="vf-local-note">
                      Saved content is encrypted inside this browser. Sharing and exporting happen only when you press the corresponding control.
                    </div>''',
          '''                <div className="vf-local-note">
                      Saved content is encrypted inside this browser. Pressing Transcribe audio sends only the current recording to the configured transcription service; saving, sharing, and exporting still require your action.
                    </div>'''
          ))

          replacements.append((
          '''                  <div className="vf-check"><b>TRANSCRIBE</b><span>Uses live browser speech recognition when the device supports it, while keeping the transcript editable.</span></div>''',
          '''                  <div className="vf-check"><b>TRANSCRIBE</b><span>Uses live browser recognition when it works and offers a reliable recorded-audio transcription button after STOP.</span></div>'''
          ))

          replacements.append((
          '''                  Live speech recognition is supplied by the browser and may send speech to that browser vendor for transcription.
                      Voice Foundry does not separately upload the saved vault. For sensitive material, users can record audio with transcription off and type notes manually.''',
          '''                  Live speech recognition is supplied by the browser and may send speech to that browser vendor. Pressing Transcribe audio uploads only that recording to the configured transcription service so text can be returned.
                      The encrypted saved vault is not uploaded. For sensitive material, keep the audio local and type notes manually instead.'''
          ))

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Required patch target was not found:\n{old[:180]}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          print("Voice Foundry transcription repair installed.")
          PY

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "NULLWORKS Deployment Bot"
          git config user.email "masoncalcolsol@gmail.com"
          git add src/app/voice-foundry/VoiceFoundryClient.tsx
          git commit -m "Repair Voice Foundry transcription on mobile"
          git push origin main
