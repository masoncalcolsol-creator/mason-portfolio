name: Derek Room 3 Production Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/derek-room3-production-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query production email readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            https://mason-portfolio-main.vercel.app/api/neuraxis/twilio/derek/health \
            | tee /tmp/neuraxis.json
          echo
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/neuraxis.json').read_text())
          env = data.get('environment') or {}
          print('ROOM3_VERSION=', data.get('version'))
          print('GMAIL_OAUTH_READY=', env.get('gmailOAuthReady'))
          print('GMAIL_CLIENT_ID=', env.get('gmailOAuthClientIdPresent'))
          print('GMAIL_CLIENT_SECRET=', env.get('gmailOAuthClientSecretPresent'))
          print('GMAIL_REFRESH_TOKEN=', env.get('gmailOAuthRefreshTokenPresent'))
          print('RECEIPT_SENDER=', env.get('receiptSender'))
          print('RECEIPT_RECIPIENT=', env.get('receiptRecipient'))
          assert data.get('version') == 'room3-email-receipt-diagnostic-v2', data
          PY
