name: Derek Room 3 Production Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/derek-room3-production-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query production health receipts
        shell: bash
        run: |
          set -euo pipefail
          echo "=== NEURAXIS ROOM 3 ==="
          curl --fail-with-body --silent --show-error \
            https://mason-portfolio-main.vercel.app/api/neuraxis/twilio/derek/health | tee /tmp/neuraxis.json
          echo
          echo "=== LENDERFLOW DIRECT BRIDGE ==="
          curl --fail-with-body --silent --show-error \
            'https://lf-lender-intake.vercel.app/api/rules/direct?health=1' | tee /tmp/lenderflow.json
          echo
          python - <<'PY'
          import json
          with open('/tmp/neuraxis.json') as f:
              n = json.load(f)
          with open('/tmp/lenderflow.json') as f:
              l = json.load(f)
          print('NEURAXIS_ENV=', json.dumps(n.get('environment', {}), sort_keys=True))
          print('LENDERFLOW_HEALTH=', json.dumps(l, sort_keys=True))
          PY
          echo "Production diagnostic complete."
