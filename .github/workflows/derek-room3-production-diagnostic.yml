name: Derek Room 3 Production Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/derek-room3-production-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify fast production lender path
        shell: bash
        run: |
          set -euo pipefail

          echo "=== LENDERFLOW DIRECT BRIDGE ==="
          curl --fail-with-body --silent --show-error \
            'https://lf-lender-intake.vercel.app/api/rules/direct?health=1' \
            -o /tmp/lenderflow.json
          cat /tmp/lenderflow.json
          echo

          echo "=== NON-MUTATING ROOM 3 BRIDGE CHECK ==="
          curl --fail-with-body --silent --show-error \
            -o /tmp/bridge.json \
            -w '%{time_total}' \
            https://mason-portfolio-main.vercel.app/api/neuraxis/twilio/derek/bridge-check \
            > /tmp/bridge_seconds.txt
          cat /tmp/bridge.json
          echo
          echo "TOTAL_SECONDS=$(cat /tmp/bridge_seconds.txt)"

          python - <<'PY'
          import json
          from pathlib import Path

          lenderflow = json.loads(Path('/tmp/lenderflow.json').read_text())
          bridge = json.loads(Path('/tmp/bridge.json').read_text())
          seconds = float(Path('/tmp/bridge_seconds.txt').read_text())

          assert lenderflow.get('ok') is True, lenderflow
          assert lenderflow.get('version') == 'room3-bridge-v6-fast-identity', lenderflow
          assert lenderflow.get('lightweightIdentityCatalog') is True, lenderflow
          assert lenderflow.get('dynamicProfileReadsDuringIdentityLookup') is False, lenderflow
          assert 'change-wholesale' in (lenderflow.get('excludedLenders') or []), lenderflow

          assert bridge.get('ok') is True, bridge
          assert bridge.get('mutationPerformed') is False, bridge
          assert bridge.get('serviceIdentity') == 'VERCEL_OIDC', bridge
          resolved = (bridge.get('lenderflow') or {}).get('resolvedLender') or {}
          assert resolved.get('slug') == 'homexpress-mortgage', bridge
          assert resolved.get('displayName') == 'HomeXpress Mortgage', bridge
          assert seconds < 5.0, f'Room 3 bridge exceeded phone budget: {seconds}s'

          print('FAST_PATH_SECONDS=', seconds)
          print('LENDERFLOW_REPORTED_MS=', (bridge.get('lenderflow') or {}).get('resolutionMs'))
          print('Room 3 production fast path verified without mutation.')
          PY
