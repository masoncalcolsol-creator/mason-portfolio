name: Fix Receipt Wallet syntax

on:
  push:
    branches: [main]
    paths:
      - src/app/receipt-wallet/page.tsx
      - .github/workflows/fix-receipt-wallet-syntax.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repair JSX class names
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/receipt-wallet/page.tsx')
          text = path.read_text()
          text = text.replace('className={styles.orbit orbitOne}', 'className={`${styles.orbit} ${styles.orbitOne}`}')
          text = text.replace('className={styles.orbit orbitTwo}', 'className={`${styles.orbit} ${styles.orbitTwo}`}')
          path.write_text(text)
          PY
      - name: Commit repair when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair needed."
            exit 0
          fi
          git config user.name "nullworks-build-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/receipt-wallet/page.tsx
          git commit -m "Fix Receipt Wallet orbit class names"
          git push
