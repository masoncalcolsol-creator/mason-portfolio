name: People First Build Check

on:
  push:
    branches:
      - main
    paths:
      - "src/app/people-first/**"
      - ".github/workflows/people-first-build-check.yml"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js application
        run: npm run build
