name: Portfolio Build Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build and capture receipt
        id: build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat build.log
          exit 0
      - name: Upload build receipt
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-build-log
          path: build.log
          if-no-files-found: error
      - name: Fail when build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1

  ciris_assurance:
    name: CIRIS pinned assurance campaign V2
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CIRIS_AGENT_COMMIT: 7f2369bed22c626404a1dcf8e09bfeb81a573d82
      CIRIS_PERSIST_COMMIT: e8cdb535b60a549948f2b0ceb43deb6921009260
    steps:
      - name: Checkout NULLWORKS harness
        uses: actions/checkout@v4

      - name: Checkout pinned CIRISAgent
        uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISAgent
          ref: 7f2369bed22c626404a1dcf8e09bfeb81a573d82
          path: ciris

      - name: Checkout pinned CIRISPersist
        uses: actions/checkout@v4
        with:
          repository: CIRISAI/CIRISPersist
          ref: e8cdb535b60a549948f2b0ceb43deb6921009260
          path: ciris-persist

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize evidence directory
        shell: bash
        run: |
          mkdir -p artifacts
          {
            echo "run_started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "github_run_id=$GITHUB_RUN_ID"
            echo "github_sha=$GITHUB_SHA"
            python --version
            rustc --version
            cargo --version
          } | tee artifacts/environment.txt
          git -C ciris rev-parse HEAD | tee artifacts/ciris-agent-actual-commit.txt
          git -C ciris-persist rev-parse HEAD | tee artifacts/ciris-persist-actual-commit.txt

      - name: Run independent source-conformance harness V2
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python tools/ciris_assurance_2026_07_31/source_conformance_v2.py \
            --agent-root ciris --persist-root ciris-persist --out artifacts \
            > artifacts/source-conformance-v2-console.log 2>&1
          code=$?
          echo "$code" > artifacts/source-conformance-v2.exit
          cat artifacts/source-conformance-v2-console.log
          exit $code

      - name: Compile pinned Python source
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m compileall -q ciris/ciris_engine ciris/ciris_adapters \
            > artifacts/python-compile.log 2>&1
          code=$?
          echo "$code" > artifacts/python-compile.exit
          cat artifacts/python-compile.log
          exit $code

      - name: Install CIRISAgent and development dependencies
        id: install_agent
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip setuptools wheel \
            > artifacts/pip-bootstrap.log 2>&1
          python -m pip install -e './ciris[dev]' \
            > artifacts/pip-install.log 2>&1
          code=$?
          echo "$code" > artifacts/pip-install.exit
          tail -n 160 artifacts/pip-install.log
          if [ "$code" -eq 0 ]; then
            python -m pip freeze | sort > artifacts/pip-freeze.txt
            python tools/ciris_assurance_2026_07_31/import_smoke.py \
              > artifacts/import-smoke.log 2>&1
            echo "$?" > artifacts/import-smoke.exit
            cat artifacts/import-smoke.log
          else
            echo "NOT_RUN_INSTALL_FAILED" > artifacts/import-smoke.exit
          fi
          exit $code

      - name: Execute imported-code jurisdiction probe
        if: steps.install_agent.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          source .venv/bin/activate
          python tools/ciris_assurance_2026_07_31/runtime_jurisdiction_probe.py \
            > artifacts/runtime-jurisdiction-probe.json 2> artifacts/runtime-jurisdiction-probe.err
          code=$?
          echo "$code" > artifacts/runtime-jurisdiction-probe.exit
          cat artifacts/runtime-jurisdiction-probe.json
          cat artifacts/runtime-jurisdiction-probe.err
          exit $code

      - name: Collect targeted CIRIS tests
        if: steps.install_agent.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          source .venv/bin/activate
          cd ciris
          python -m pytest -q -o addopts= --collect-only \
            tests/test_deferral_permissions.py \
            tests/services/lifecycle/scheduler/test_deferred_reactivation.py \
            tests/adapters/accord_metrics/test_lens_fold_integration.py \
            tests/ciris_engine/logic/processors/core/thought_processor/test_conscience_execution_helpers.py \
            tests/test_updated_status_conscience.py \
            > ../artifacts/pytest-collect.log 2>&1
          code=$?
          echo "$code" > ../artifacts/pytest-collect.exit
          cat ../artifacts/pytest-collect.log
          exit $code

      - name: Execute targeted CIRIS project tests
        if: steps.install_agent.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          source .venv/bin/activate
          cd ciris
          python -m pytest -q -o addopts= \
            tests/test_deferral_permissions.py \
            tests/services/lifecycle/scheduler/test_deferred_reactivation.py \
            tests/adapters/accord_metrics/test_lens_fold_integration.py \
            tests/ciris_engine/logic/processors/core/thought_processor/test_conscience_execution_helpers.py \
            tests/test_updated_status_conscience.py \
            --junitxml=../artifacts/pytest-targeted-junit.xml \
            > ../artifacts/pytest-targeted.log 2>&1
          code=$?
          echo "$code" > ../artifacts/pytest-targeted.exit
          cat ../artifacts/pytest-targeted.log
          exit $code

      - name: Run CIRISPersist correction-precedence tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd ciris-persist
          cargo test precedence -- --nocapture \
            > ../artifacts/cargo-precedence.log 2>&1
          code=$?
          echo "$code" > ../artifacts/cargo-precedence.exit
          tail -n 240 ../artifacts/cargo-precedence.log
          exit $code

      - name: Build telemetry and SHA-256 manifest
        if: always()
        shell: bash
        run: |
          python tools/ciris_assurance_2026_07_31/build_manifest.py
          sha256sum artifacts/* | sort > artifacts/SHA256SUMS.txt
          cat artifacts/RUN_SUMMARY.md

      - name: Upload assurance evidence packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ciris-assurance-v2-2026-07-31-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Publish assurance summary
        if: always()
        shell: bash
        run: cat artifacts/RUN_SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
