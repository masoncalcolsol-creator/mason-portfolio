name: Portfolio Build Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build and capture receipt
        id: build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat build.log
          exit 0
      - name: Upload build receipt
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-build-log
          path: build.log
          if-no-files-found: error
      - name: Fail when build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
